<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Barışalım mı?</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ffd6e8, #ffecec);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
    }

    #container {
        text-align: center;
        z-index: 2;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 30px;
    }

    button {
        padding: 15px 30px;
        font-size: 22px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 10px;
    }

    #yes {
        background: #4CAF50;
        color: white;
    }

    #no {
        background: #f44336;
        color: white;
        position: relative;
    }

    .heart {
        position: fixed;
        color: red;
        font-size: 24px;
        animation: float 4s linear forwards;
    }

    @keyframes float {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-600px);
            opacity: 0;
        }
    }

    .flower {
        position: fixed;
        top: -50px;
        font-size: 30px;
        animation: fall 5s linear forwards;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh);
            opacity: 0;
        }
    }
</style>
</head>
<body>

<div id="container">
    <h1 id="question">AHENK ŞEYMA'M ❤️ benimle barışır mısın?</h1>
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
</div>

<script>
    let noCount = 0;
    let yesScale = 1;

    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const question = document.getElementById("question");

    // ❤️ Kalpler
    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "0";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }

    setInterval(createHeart, 700);

    // 🌸 Çiçek yağmuru
    function flowerRain() {
        const flowers = ["🌸","🌺","🌼","💐","🌷"];
        const flower = document.createElement("div");
        flower.className = "flower";
        flower.innerText = flowers[Math.floor(Math.random()*flowers.length)];
        flower.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 5000);
    }

    // 📳 Titreşim
    function vibrate() {
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }
    }

    // 😈 Hayır kaçıyor
    noBtn.addEventListener("mouseenter", () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.position = "fixed";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    noBtn.onclick = () => {
        noCount++;
        vibrate();

        yesScale += 0.4;
        yesBtn.style.transform = `scale(${yesScale})`;

        if (noCount >= 4) {
            yesBtn.style.position = "fixed";
            yesBtn.style.top = 0;
            yesBtn.style.left = 0;
            yesBtn.style.width = "100vw";
            yesBtn.style.height = "100vh";
            yesBtn.style.fontSize = "50px";
            yesBtn.innerText = "EVET 💖";
        }
    };

    yesBtn.onclick = () => {
        question.innerText = "💖 Yaşasın! Barıştık 💖";
        noBtn.remove();
        yesBtn.remove();
        setInterval(flowerRain, 300);
    };
</script>

</body>

</html>
